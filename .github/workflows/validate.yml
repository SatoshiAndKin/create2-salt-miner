name: Validate mining and PGO

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C target-cpu=x86-64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt,llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-pgo,cargo-nextest,cargo-deny
      - name: Install OpenCL runtime
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd
      - name: Validate Rust and native OpenCL mining
        run: |
          cargo fmt --all -- --check
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo nextest run --locked --run-ignored all --test-threads 1
          cargo deny check
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build with a fresh Linux PGO profile
        run: just pgo-release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-pgo
          path: |
            target/x86_64-unknown-linux-gnu/release/salty
            target/pgo-profiles/*.profdata

  windows-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cross
      - name: Check Windows and package the native training executable
        run: |
          just windows-check
          just windows-pgo-instrument
      - uses: actions/upload-artifact@v4
        with:
          name: windows-pgo-bundle
          path: target/windows-pgo-bundle.zip
