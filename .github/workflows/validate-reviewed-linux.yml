name: Reviewed Linux validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    if: github.repository == 'SatoshiAndKin/create2-salt-miner'
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-build
    container:
      image: docker.io/library/ubuntu:24.04@sha256:9a04f13b3f80ef056361e30868593b1cfd2279fe19e4081cb93a90bf56819d6a
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: /github/home/.cargo
      RUSTUP_HOME: /github/home/.rustup
      RUSTFLAGS: "-C target-cpu=x86-64"
    steps:
      - name: Install the build and CPU OpenCL dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git ocl-icd-opencl-dev \
            pkg-config pocl-opencl-icd python3 xz-utils zstd
      - uses: actions/checkout@v4
      - name: Install pinned Rust in the job container
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/rustup-init"
          curl --fail --silent --show-error --location --retry 2 --proto '=https' \
            https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init \
            --output "$installer"
          printf '%s  %s\n' '4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10' "$installer" | sha256sum --check
          chmod 0700 "$installer"
          HOME=/root "$installer" -y --no-modify-path --profile minimal --default-toolchain 1.98.0 \
            --component clippy --component rustfmt --component llvm-tools-preview
          "$CARGO_HOME/bin/rustc" --version
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-pgo,cargo-nextest,cargo-deny
      - name: Validate Rust and native OpenCL mining
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo fmt --all -- --check
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo nextest run --locked --run-ignored all
          cargo deny check
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build with a fresh Linux PGO profile
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          just pgo-release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-pgo
          path: |
            target/x86_64-unknown-linux-gnu/release/salty
            target/pgo-profiles/*.profdata

  windows-cross:
    if: github.repository == 'SatoshiAndKin/create2-salt-miner'
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Place Rust toolchain data in the shared workspace volume
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/windows-toolchain"
          mkdir -p "$root"/{cargo,rustup,home}
          printf 'CARGO_HOME=%s/cargo\nRUSTUP_HOME=%s/rustup\n' "$root" "$root" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-pc-windows-gnu
      - name: Check and build the Windows GNU target
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/windows-toolchain"
          cargo=$(rustup which --toolchain 1.98.0 cargo)
          test "${cargo#"$RUSTUP_HOME/toolchains/"}" != "$cargo"
          docker build --platform linux/amd64 --file Dockerfile.cross --tag salty-windows-cross .
          run=(docker run --rm --user "$(id -u):$(id -g)"
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=$GITHUB_WORKSPACE"
            --mount "type=bind,src=$root,dst=$root"
            --workdir "$GITHUB_WORKSPACE"
            --env "HOME=$root/home" --env CARGO_HOME --env RUSTUP_HOME
            --env "RUSTC=${cargo%/cargo}/rustc" --env "RUSTFLAGS=-C target-cpu=x86-64"
            --entrypoint "$cargo" salty-windows-cross)
          "${run[@]}" check --locked --target x86_64-pc-windows-gnu
          "${run[@]}" build --release --locked --target x86_64-pc-windows-gnu
          test -s target/x86_64-pc-windows-gnu/release/salty.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-gnu
          path: target/x86_64-pc-windows-gnu/release/salty.exe
          if-no-files-found: error
